spring:
  application:
    name: BookService


  datasource:
    url: jdbc:mysql://localhost:3306/bookdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect




  cache:
    cache-names: bookcache
    type: redis
  data:
    redis:
      host: localhost
      port: 6379


